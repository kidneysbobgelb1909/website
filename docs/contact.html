<script>
    document.querySelector('.menu-btn').addEventListener('click', function () {
        var nav = document.getElementById('nav');
        var open = nav.classList.toggle('open');
        this.setAttribute('aria-expanded', open);
    });

    (function () {
        var labels = {"auto": "外觀：自動（跟隨系統）", "light": "外觀：淺色", "dark": "外觀：深色"};
        var order = ['auto', 'light', 'dark'];
        var root = document.documentElement;
        var btn = document.querySelector('.theme-btn');
        var mode = root.getAttribute('data-theme') || 'auto';
        function apply(m) {
            if (m === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', m);
            btn.dataset.mode = m;
            btn.setAttribute('aria-label', labels[m]);
            btn.title = labels[m];
        }
        apply(mode);
        btn.addEventListener('click', function () {
            mode = order[(order.indexOf(mode) + 1) % order.length];
            apply(mode);
            try { if (mode === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', mode); } catch (e) {}
        });
    })();
</script>
